[package]
name = "aoip-engine"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
description = "Motor de rede do AoIP Bridge (PTP, SAP, RTP) independente da placa de audio"

[dependencies]
aoip-core = { path = "../core" }
socket2 = { version = "0.5", features = ["all"] }

# Lista das placas de rede e nome dos computadores (bibliotecas do proprio sistema).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[package]
name = "aoip-winvirtual"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
description = "AoIP Virtual para Windows: placa virtual sempre ligada, com icone perto do relogio"

[dependencies]
aoip-core = { path = "../core" }
aoip-engine = { path = "../engine" }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry"] }
